# The core is pure (docs/ARCHITECTURE.md, decision A2). These bans make I/O a lint error here.
# Time arrives as a `Stamp` from the caller; nothing in core may read a clock or touch the OS.
# Do NOT add `#[allow(clippy::disallowed_*)]` to get around this — move the code to `app` instead.

disallowed-types = [
    { path = "std::time::Instant", reason = "core takes time as a Stamp parameter (A1/A6)" },
    { path = "std::time::SystemTime", reason = "core takes time as a Stamp parameter (A1/A6)" },
    { path = "std::process::Command", reason = "processes belong in app (CommandRunner)" },
    { path = "std::process::Child", reason = "processes belong in app (CommandRunner)" },
    { path = "std::fs::File", reason = "file I/O belongs in app" },
    { path = "std::fs::OpenOptions", reason = "file I/O belongs in app" },
    { path = "std::net::TcpStream", reason = "network I/O belongs in app" },
    { path = "std::net::TcpListener", reason = "network I/O belongs in app" },
    { path = "std::net::UdpSocket", reason = "network I/O belongs in app" },
    { path = "std::os::unix::net::UnixStream", reason = "network I/O belongs in app" },
]

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "core takes time as a Stamp parameter" },
    { path = "std::time::SystemTime::now", reason = "core takes time as a Stamp parameter" },
    { path = "std::process::Command::new", reason = "processes belong in app" },
    { path = "std::process::exit", reason = "core never exits the process" },
    { path = "std::fs::read", reason = "file I/O belongs in app" },
    { path = "std::fs::read_to_string", reason = "file I/O belongs in app (tests: use include_str!)" },
    { path = "std::fs::read_dir", reason = "file I/O belongs in app" },
    { path = "std::fs::write", reason = "file I/O belongs in app" },
    { path = "std::fs::create_dir_all", reason = "file I/O belongs in app" },
    { path = "std::fs::remove_file", reason = "file I/O belongs in app" },
    { path = "std::fs::File::open", reason = "file I/O belongs in app" },
    { path = "std::fs::File::create", reason = "file I/O belongs in app" },
    { path = "std::thread::spawn", reason = "concurrency belongs in app" },
    { path = "std::thread::sleep", reason = "core never blocks; time is a parameter" },
    { path = "std::env::var", reason = "environment is read in app and passed in as config" },
    { path = "std::env::vars", reason = "environment is read in app and passed in as config" },
    { path = "std::env::args", reason = "CLI args are parsed in app" },
    { path = "std::io::stdin", reason = "terminal I/O belongs in app" },
    { path = "std::io::stdout", reason = "terminal I/O belongs in app" },
    { path = "std::io::stderr", reason = "terminal I/O belongs in app" },
]

disallowed-macros = [
    { path = "std::println", reason = "core never prints; return values instead" },
    { path = "std::print", reason = "core never prints; return values instead" },
    { path = "std::eprintln", reason = "core never prints; return values instead" },
    { path = "std::eprint", reason = "core never prints; return values instead" },
    { path = "std::dbg", reason = "no debug output in core" },
]
